<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo: mismo degradado indigo→violeta→cian de la app -->
    <linearGradient id="bg" x1="120" y1="60" x2="920" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="48%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0ea5b7"/>
    </linearGradient>

    <!-- Capa de "vidrio": brillo diagonal superior -->
    <linearGradient id="glassSheen" x1="180" y1="80" x2="820" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Reflejo inferior sutil (rebote de luz) -->
    <linearGradient id="bounce" x1="512" y1="1024" x2="512" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="innerGlow" cx="50%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pulseStroke" x1="180" y1="512" x2="844" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>

    <filter id="glowLine" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="squircle">
      <path d="M512 40
               C 830 40 984 194 984 512
               C 984 830 830 984 512 984
               C 194 984 40 830 40 512
               C 40 194 194 40 512 40 Z"/>
    </clipPath>
  </defs>

  <!-- Base squircle -->
  <g filter="url(#softShadow)">
    <path d="M512 40
             C 830 40 984 194 984 512
             C 984 830 830 984 512 984
             C 194 984 40 830 40 512
             C 40 194 194 40 512 40 Z"
          fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircle)">
    <!-- rebote inferior -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bounce)"/>
    <!-- brillo difuso general (sensación de vidrio grueso) -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#innerGlow)"/>

    <!-- panel de vidrio: elipse gruesa que cruza la parte superior -->
    <ellipse cx="430" cy="230" rx="520" ry="300" fill="url(#glassSheen)"/>

    <!-- borde interior brillante (rim light), como el filo de un cristal -->
    <path d="M512 40
             C 830 40 984 194 984 512
             C 984 830 830 984 512 984
             C 194 984 40 830 40 512
             C 40 194 194 40 512 40 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4"/>

    <!-- línea de pulso / EKG — el glifo central -->
    <polyline points="176,560 340,560 392,420 452,660 512,340 566,560 620,480 664,560 848,560"
              fill="none" stroke="url(#pulseStroke)" stroke-width="34"
              stroke-linecap="round" stroke-linejoin="round" filter="url(#glowLine)"/>

    <!-- punto de "precisión" -->
    <circle cx="512" cy="340" r="20" fill="#ffffff"/>
  </g>
</svg>
